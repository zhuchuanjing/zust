[package]
name = "zusts"
version = "0.9.0"
edition = "2024"

[dependencies]
dynamic = {path = "../dynamic"}
parser = {path = "../parser"}
compiler = {path = "../compiler"}
root = {path = "../root"}
vm = {path = "../vm", features = ["ir-disassembly"]}
vm-spirv = {path = "../vm-spirv"}
vulkan = {path = "../vulkan"}
