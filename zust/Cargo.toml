[package]
name = "zust"
version = "0.2.2"
edition.workspace = true
license = "Apache-2.0"
publish = true
description = "通用 zust 脚本运行器:zust <script.zs> [args...],把剩余参数以 ctx 形式传给 .zs 脚本。CLI 入口支持 main(ctx) 函数,ctx 含 script/function/cwd/args。"
repository = "https://github.com/zhuchuanjing/zust"
homepage = "https://www.zust-lang.com"
documentation = "https://docs.rs/zust"
keywords = ["zust", "scripting", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "zust"
path = "src/main.rs"

# 默认无 feature。binary 只包含 CLI runner 本身。

[features]
# process 是高危能力(执行任意命令),由使用方显式开启。
process = ["vm/process"]
pty = ["vm/pty", "process"]
stdio = ["vm/stdio"]
agent = ["vm/agent"]
patch = ["vm/patch"]
# llm 转发:脚本内直接调模型(zbuddy harness 走 vm 内注册,CLI 调试用)
llm = ["vm/llm"]
http = ["vm/http"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
dynamic = { package = "zust-dynamic", version = "0.9.25", path = "../dynamic" }
root = { package = "zust-root", version = "0.9.25", path = "../root" }
smol_str = "0.3"
vm = { package = "zust-vm", version = "0.9.106", path = "../vm" }
