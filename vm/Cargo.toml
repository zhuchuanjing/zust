[package]
name = "zust-vm"
version = "0.9.16"
edition = "2024"
rust-version = "1.85"
description = "Cranelift JIT runtime for executing Zust modules."
license = "Apache-2.0"
repository = "https://github.com/zhuchuanjing/zust"
keywords = ["zust", "jit", "runtime"]
categories = ["compilers", "development-tools"]

[lib]
name = "vm"

[features]
default = []
ir-disassembly = []

[dependencies]
log = "0.4.29"
dynamic = { package = "zust-dynamic", version = "0.9.4", path = "../dynamic" }
parser = { package = "zust-parser", version = "0.9.5", path = "../parser" }
compiler = { package = "zust-compiler", version = "0.9.6", path = "../compiler" }
root = { package = "zust-root", version = "0.9.4", path = "../root" }
llm = { package = "zust-llm", version = "0.9.4", path = "../llm" }
vm-spirv = { package = "zust-vm-spirv", version = "0.9.2", path = "../vm-spirv" }
vulkan = { package = "zust-vulkan", version = "0.9.3", path = "../vulkan" }

anyhow = "1.0.102"
thiserror = "2.0.18"
smol_str = "0.3.6"
bytemuck = "1.25.0"
vulkano = "0.35.2"

cranelift = "0.131.1"
cranelift-module = "0.131.1"
cranelift-jit = "0.131.1"

tokio = {version = "1.52.3", features = ["full"]}
uuid = { version = "1.23.1", features = ["v4"]}
rand = "0.10.1"
reqwest = "0.13.3"
base64 = "0.22.1"
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "any"] }
sqlx-mysql = { version = "0.8.6", default-features = false, features = ["any"] }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["any"] }

[target.'cfg(target_os = "macos")'.dependencies]
vm-metal = { package = "zust-vm-metal", version = "0.9.3", path = "../vm-metal" }

[dev-dependencies]
num-bigint = "0.4.6"
num-traits = "0.2.19"
