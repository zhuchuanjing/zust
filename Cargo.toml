[workspace]
    members = [
        "dynamic",
        "parser",
        "compiler",
        "vm",
        "vm-spirv",
        "vm-metal",
        "vulkan",
        "zusts",
        "root",
        "llm",
        "zust-lsp",
        "benches",
    ]
    # fuzz 是独立 workspace(需 nightly + cargo-fuzz),不纳入常规构建/测试。
    exclude = ["fuzz"]
    resolver = "2"
