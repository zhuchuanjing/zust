[package]
name = "zust-vm"
version = "0.9.81"
edition = "2024"
rust-version = "1.85"
description = "Cranelift JIT runtime for executing Zust modules."
license = "Apache-2.0"
repository = "https://github.com/zhuchuanjing/zust"
homepage = "https://www.zust-lang.com"
keywords = ["zust", "jit", "runtime"]
categories = ["compilers", "development-tools"]

[lib]
name = "vm"

[features]
default = []
full = ["http", "db", "llm", "gpu"]
ir-disassembly = []
http = ["dep:axum", "dep:futures-util", "dep:reqwest", "dep:tokio", "dep:tower-http"]
db = ["dep:sqlx-core", "dep:sqlx-mysql", "dep:sqlx-postgres", "dep:tokio"]
llm = ["dep:llm", "dep:tokio"]
gpu = ["dep:vm-spirv", "dep:vm-metal"]
vulkan = ["gpu", "dep:vulkan", "dep:vulkano"]
metal = ["gpu", "vm-metal/runtime"]
iroh = ["root/iroh"]

[dependencies]
log = "0.4.29"
dynamic = { package = "zust-dynamic", version = "0.9.18", path = "../dynamic" }
parser = { package = "zust-parser", version = "0.9.18", path = "../parser" }
compiler = { package = "zust-compiler", version = "0.9.38", path = "../compiler" }
root = { package = "zust-root", version = "0.9.8", path = "../root" }
llm = { package = "zust-llm", version = "0.9.16", path = "../llm", optional = true }
vm-spirv = { package = "zust-vm-spirv", version = "0.9.9", path = "../vm-spirv", optional = true }
vulkan = { package = "zust-vulkan", version = "0.9.4", path = "../vulkan", optional = true }

anyhow = "1.0.102"
thiserror = "2.0.18"
smol_str = "0.3.6"
bytemuck = "1.25.0"
vulkano = { version = "0.35.2", optional = true }

cranelift = "0.131.1"
cranelift-module = "0.131.1"
cranelift-jit = "0.131.1"

tokio = {version = "1.52.3", features = ["full"], optional = true}
uuid = { version = "1.23.1", features = ["v4"]}
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
rand = "0.10.1"
reqwest = { version = "0.13.3", optional = true }
axum = { version = "0.8.9", features = ["ws"], optional = true }
tower-http = { version = "0.6.10", features = ["cors", "fs"], optional = true }
futures-util = { version = "0.3.32", optional = true }
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "any"], optional = true }
sqlx-mysql = { version = "0.8.6", default-features = false, features = ["any"], optional = true }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["any"], optional = true }
parking_lot = "0.12.3"

[target.'cfg(target_os = "macos")'.dependencies]
vm-metal = { package = "zust-vm-metal", version = "0.9.11", path = "../vm-metal", default-features = false, optional = true }

[dev-dependencies]
num-bigint = "0.4.6"
num-traits = "0.2.19"
