[package]
name = "zust-llm"
version = "0.9.25"
edition = "2024"
rust-version = "1.85"
description = "LLM request helpers for Zust runtime integrations."
license = "Apache-2.0"
repository = "https://github.com/zhuchuanjing/zust"
homepage = "https://www.zust-lang.com"
keywords = ["zust", "llm", "runtime"]
categories = ["api-bindings"]

[lib]
name = "llm"

[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:serde_json"]
cuda = ["candle", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[[example]]
name = "kalm_embed"
required-features = ["candle"]

[dependencies]
dynamic = { package = "zust-dynamic", version = "0.9.19", path = "../dynamic" }
root = { package = "zust-root", version = "0.9.15", path = "../root" }
hex = "0.4.3"
reqwest = { version = "0.13.3", features = ["stream", "native-tls"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
smol_str = "0.3.6"
futures-util = "0.3.32"
bytes = "1.11.1"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
log = "0.4.29"
base64 = "0.22.1"
uuid = { version = "1.23.1", features = ["v4"]}
regex = "1.12.3"
hmac = "0.12.1"
sha2 = "0.10.9"
jiff = "0.2.24"
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
tokenizers = { version = "0.22.1", optional = true }
serde_json = { version = "1.0.145", optional = true }
