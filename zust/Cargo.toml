[package]
name = "zust"
version = "0.1.1"
edition.workspace = true
license = "Apache-2.0"
publish = true
description = "通用 zust 脚本运行器:zust <script.zs> [args...],把剩余参数以 ctx 形式传给 .zs 脚本。默认启用 tree-sitter + source::scan_repo,支持 41 种主流语言。CLI 入口支持 main(ctx) 函数,ctx 含 script/function/cwd/args。"
repository = "https://github.com/zhuchuanjing/zust"
homepage = "https://www.zust-lang.com"
documentation = "https://docs.rs/zust"
keywords = ["zust", "scripting", "tree-sitter", "cli", "code-analysis"]
categories = ["command-line-utilities"]

[[bin]]
name = "zust"
path = "src/main.rs"

[features]
default = ["tree-sitter"]
# 启用 tree-sitter + 主流语言 grammar。脚本侧暴露的只有:
#   source::scan_repo(path, project, run_id)  -> Dynamic{files, language_files, audit}
#   source::supported_languages()               -> List<String>
# 内部 tree-sitter node 接口不向 zust 暴露。
# 注意:tree-sitter 0.26 是当前基准,所有 grammar 须与之兼容。
tree-sitter = [
    "dep:tree-sitter", "dep:walkdir",
    "dep:tree-sitter-rust", "dep:tree-sitter-c",
    "dep:tree-sitter-cpp", "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript", "dep:tree-sitter-go", "dep:tree-sitter-python",
    "dep:tree-sitter-ruby", "dep:tree-sitter-php", "dep:tree-sitter-bash",
    "dep:tree-sitter-perl", "dep:tree-sitter-lua", "dep:tree-sitter-tcl",
    "dep:tree-sitter-java", "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-c-sharp", "dep:tree-sitter-gdscript",
    "dep:tree-sitter-glsl", "dep:tree-sitter-wgsl",
    "dep:tree-sitter-swift", "dep:tree-sitter-scala",
    "dep:tree-sitter-haskell", "dep:tree-sitter-elm",
    "dep:tree-sitter-ocaml", "dep:tree-sitter-zig", "dep:tree-sitter-r",
    "dep:tree-sitter-html", "dep:tree-sitter-css",
    "dep:tree-sitter-json", "dep:tree-sitter-yaml",
    "dep:tree-sitter-toml-ng", "dep:tree-sitter-markdown-updated",
    "dep:tree-sitter-containerfile",
    "dep:tree-sitter-elixir", "dep:tree-sitter-sequel",
    "dep:tree-sitter-erlang", "dep:tree-sitter-fsharp", "dep:tree-sitter-d",
]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
dynamic = { package = "zust-dynamic", version = "0.9.24", path = "../dynamic" }
root = { package = "zust-root", version = "0.9.23", path = "../root" }
smol_str = "0.3"
uuid = { version = "1", features = ["v4"] }
vm = { package = "zust-vm", version = "0.9.103", path = "../vm" }
walkdir = { version = "2", optional = true }

# tree-sitter grammars(全部 optional,跟 tree-sitter 0.26 兼容)
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-perl = { version = "1.1", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-tcl = { version = "2.0", optional = true, package = "bca-tree-sitter-tcl" }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-gdscript = { version = "6.1", optional = true }
tree-sitter-glsl = { version = "0.2", optional = true }
tree-sitter-wgsl = { version = "0.1", optional = true, package = "tree-sitter-wgsl-bevy" }

tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-haskell = { version = "0.23", optional = true }
tree-sitter-elm = { version = "5.9", optional = true }

tree-sitter-ocaml = { version = "0.24", optional = true }
tree-sitter-zig = { version = "1", optional = true }
tree-sitter-r = { version = "1", optional = true }

tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-erlang = { version = "0.13", optional = true }
tree-sitter-fsharp = { version = "0.3", optional = true }
tree-sitter-d = { version = "0.8", optional = true }

# 以下 grammar 原 crate(tree-sitter-toml 0.20/tree-sitter-markdown 0.7/
# tree-sitter-dockerfile 0.1/tree-sitter-elixir 0.1/tree-sitter-sql 0.0)
# 依赖老版 tree-sitter 0.19/0.20,与项目用的 0.26 不兼容。换用以下兼容版:
#   tree-sitter-toml-ng          0.7     -> tree-sitter-language 0.1(新 API)
#   tree-sitter-markdown-updated 0.1     -> tree-sitter >= 0.21
#   tree-sitter-containerfile    0.9     -> tree-sitter-language 0.1(同时覆盖 Dockerfile)
#   tree-sitter-elixir           0.3.5   -> tree-sitter-language 0.1
#   tree-sitter-sequel           0.3     -> tree-sitter-language 0.1
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-markdown-updated = { version = "0.1", optional = true }
tree-sitter-containerfile = { version = "0.9", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }
